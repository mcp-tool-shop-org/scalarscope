name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

    - name: Reject a tag that is not the Store identity
      shell: pwsh
      run: |
        $ref = $env:GITHUB_REF
        if ($ref -like 'refs/tags/*') {
          $tag = $ref.Substring('refs/tags/'.Length)
          $version = $tag
          if ($version.StartsWith('v')) { $version = $version.Substring(1) }
          if ($version -ne '3.0.0.0') {
            throw "Tag $tag is not 3.0.0.0. The Store identity stays 3.0.0.0 and is not rewritten from the tag."
          }
        }

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Build the review
      shell: pwsh
      run: |
        $env:RUSTFLAGS = "--remap-path-prefix=$env:USERPROFILE=. -C target-feature=+crt-static"
        cargo build --release --manifest-path rust/Cargo.toml

    - name: Pack the unsigned MSIX
      shell: pwsh
      run: ./packaging/pack.ps1

    - name: Create Release
      uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
      with:
        files: release/*
        body_path: CHANGELOG.md
        draft: true
        prerelease: ${{ contains(github.ref, 'rc') || contains(github.ref, 'beta') || contains(github.ref, 'alpha') }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
