name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-release:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        persist-credentials: false

    - name: Reject a tag that is not the Store identity
      shell: pwsh
      run: |
        if ($env:GITHUB_REF -ne 'refs/tags/v3.0.0.0') {
          throw "Release runs only for refs/tags/v3.0.0.0. A manual run from another ref is refused. The Store identity stays 3.0.0.0."
        }

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
      with:
        toolchain: 1.98.1

    - name: Build the review
      shell: pwsh
      run: |
        $env:RUSTFLAGS = "--remap-path-prefix=$env:USERPROFILE=. --remap-path-prefix=$env:GITHUB_WORKSPACE=. -C target-feature=+crt-static"
        cargo build --release --locked --manifest-path rust/Cargo.toml

    - name: Pack the unsigned MSIX
      shell: pwsh
      run: ./packaging/pack.ps1

    - name: Upload the unsigned package
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: store-package
        path: release/*
        if-no-files-found: error

  publish:
    needs: build-release
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        persist-credentials: false

    - name: Download the unsigned package
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: store-package
        path: release

    - name: Create Release
      uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
      with:
        files: release/*
        body_path: CHANGELOG.md
        draft: true
        prerelease: ${{ contains(github.ref, 'rc') || contains(github.ref, 'beta') || contains(github.ref, 'alpha') }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
