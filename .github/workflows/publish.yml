name: Publish to NuGet

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    # VortexKit is not published to NuGet. This job does not run.
    if: ${{ false }}
    runs-on: windows-latest
    environment: nuget
    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          dotnet-version: '9.0.x'

      - name: Install MAUI workload
        run: dotnet workload install maui-windows --skip-sign-check

      - name: Restore VortexKit
        run: dotnet restore src/VortexKit/VortexKit.csproj

      - name: Build VortexKit
        run: dotnet build src/VortexKit/VortexKit.csproj --configuration Release --no-restore

      - name: Pack VortexKit
        run: dotnet pack src/VortexKit/VortexKit.csproj --configuration Release --no-build --output ./nupkg

      - name: Login to NuGet (Trusted Publishing)
        uses: nuget/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        id: nuget-login
        with:
          user: mcp-tool-shop
