[package]
name = "scalarscope"
version = "3.0.0"
edition = "2021"
publish = false
description = "Compare two inference traces, or two backpropagate training runs."
license = "MIT"

[dependencies]
eframe = "0.36"
flate2 = "1"
png = "0.18"
egui_plot = "0.37"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
workbench = { git = "https://github.com/mcp-tool-shop-org/runforge", rev = "39c0ce7f85f9a022185b93092a3448799c399ee0" }
zip = { version = "2", default-features = false, features = ["deflate"] }
