# The bar is 90% line coverage on the Rust review, and on the lines a pull
# request changes. `cargo llvm-cov --fail-under-lines 90` enforces the same
# number before this upload. The .NET tree is the previous package source.
# It is not part of this percentage.
coverage:
  status:
    project:
      default:
        target: 90%
        threshold: 0%
        informational: false
    patch:
      default:
        target: 90%
        threshold: 0%
        informational: false

comment:
  layout: "condensed_header, condensed_files, condensed_footer"
  hide_project_coverage: false
  require_changes: false

ignore:
  - "src/ScalarScope"
  - "src/VortexKit"
  - "tests/ScalarScope.FixtureTests"
  - "tests/ScalarScope.DeterminismTests"
  - "tests/ScalarScope.SoakTests"
  - "tests/Fixtures"
